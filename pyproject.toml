[project]
name = "hgnnfs"
version = "0.1.0"
description = "Hyperbolic Graph Neural Filesystem Search - Phase 0 Python Prototype"
requires-python = ">=3.14"
dependencies = [
    "torch>=2.13.0",
    "numpy>=2.5.0",
    "tqdm>=4.70.0",
    "pymupdf>=1.28.0",
    "sentence-transformers>=5.6.0",
    "scikit-learn>=1.9.0",
    "optimum[onnxruntime]>=2.1.0",
    "beir>=2.2.0",
]

[project.optional-dependencies]
fsmonitor = ["watchdog>=6.0.0"]
dev = ["pytest>=8.0"]
onnx-export = ["onnx>=1.17", "onnxruntime>=1.19", "optimum>=2.1", "onnxscript>=0.2"]

[tool.setuptools.packages.find]
include = ["hgnfs_py", "hgnfs_py.*"]
